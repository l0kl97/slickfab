<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="t d">
  <title id="t">slickfab: Autopilot-Schleife</title>
  <desc id="d">Ein Dispatcher liest Linear, GitHub und die Terminals, startet Rollen in Herdr-Terminals und schickt Nachbesserungen. Die Rollen öffnen Pull Requests auf GitHub und melden sich als Linear-Kommentar mit Status-Marker zurück. Du greifst nur an den Gates ein.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f2328; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lane { fill: #59636e; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.04em; }
    .note { fill: #59636e; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .step { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .steptext { fill: #1f2328; font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sub { fill: #59636e; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .gate { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.4; }
    .gatetext { fill: #3b2300; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .gatesub { fill: #4d2d00; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .brake { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .braketext { fill: #82071e; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .brakesub { fill: #5c0011; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .line { stroke: #6e7781; stroke-width: 1.5; fill: none; }
    .dash { stroke: #6e7781; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #3d444d; }
      .title { fill: #f0f6fc; }
      .lane, .note, .sub { fill: #9198a1; }
      .step { fill: #151b23; stroke: #656c76; }
      .steptext { fill: #f0f6fc; }
      .gate { fill: #2e2410; stroke: #d29922; }
      .gatetext { fill: #f2cc60; }
      .gatesub { fill: #e3c77a; }
      .brake { fill: #2d1316; stroke: #f85149; }
      .braketext { fill: #ff9492; }
      .brakesub { fill: #f0b4b1; }
      .line, .dash { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="879" height="419" rx="10"/>
  <text class="title" x="24" y="34">Autopilot-Schleife (gebaut, noch nicht live)</text>

  <!-- You -->
  <rect class="gate" x="220" y="56" width="440" height="54" rx="6"/>
  <text class="gatetext" x="440" y="79" text-anchor="middle">Du, nur an den Gates</text>
  <text class="gatesub" x="440" y="98" text-anchor="middle">Tickets freigeben · mergen · door:one-way · needs-human</text>

  <!-- Linear -->
  <rect class="step" x="24" y="160" width="210" height="80" rx="6"/>
  <text class="steptext" x="129" y="186" text-anchor="middle">Linear</text>
  <text class="sub" x="129" y="206" text-anchor="middle">die Zustandsmaschine:</text>
  <text class="sub" x="129" y="223" text-anchor="middle">Tickets, Status, Labels</text>

  <!-- Dispatcher -->
  <rect class="step" x="335" y="160" width="210" height="80" rx="6"/>
  <text class="steptext" x="440" y="186" text-anchor="middle">Dispatcher</text>
  <text class="sub" x="440" y="206" text-anchor="middle">tick · watch · --dry-run</text>
  <text class="sub" x="440" y="223" text-anchor="middle">entscheidet den nächsten Schritt</text>

  <!-- GitHub -->
  <rect class="step" x="646" y="160" width="210" height="80" rx="6"/>
  <text class="steptext" x="751" y="186" text-anchor="middle">GitHub</text>
  <text class="sub" x="751" y="206" text-anchor="middle">Pull Requests, CI,</text>
  <text class="sub" x="751" y="223" text-anchor="middle">Review-Kommentare</text>

  <!-- Roles -->
  <rect class="step" x="220" y="300" width="440" height="62" rx="6"/>
  <text class="steptext" x="440" y="324" text-anchor="middle">Rollen in Herdr-Terminals</text>
  <text class="sub" x="440" y="345" text-anchor="middle">implementer · reviewer · debugger · verifier · retro</text>

  <!-- reads -->
  <path class="line" d="M333,200 H236" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="sub" x="284" y="192" text-anchor="middle">liest, schreibt</text>
  <path class="line" d="M547,200 H644" marker-start="url(#arrow)"/>
  <text class="sub" x="596" y="192" text-anchor="middle">liest</text>
  <!-- starts -->
  <path class="line" d="M440,240 V298" marker-end="url(#arrow)"/>
  <text class="sub" x="450" y="274">startet, schickt Nachbesserung</text>
  <!-- roles report -->
  <path class="line" d="M220,331 H129 V242" marker-end="url(#arrow)"/>
  <text class="sub" x="138" y="290">meldet mit</text>
  <text class="sub" x="138" y="306">Marker</text>
  <path class="line" d="M660,331 H751 V242" marker-end="url(#arrow)"/>
  <text class="sub" x="742" y="290" text-anchor="end">Pull Request</text>
  <!-- you -->
  <path class="dash" d="M220,83 H129 V158" marker-end="url(#arrow)"/>
  <path class="dash" d="M660,83 H751 V158" marker-end="url(#arrow)"/>

  <text class="note" x="24" y="398">Auto-Merge ist aus, solange ein Projekt ihn nicht einschaltet, und auch dann nur für kleine Tickets ohne door:one-way.</text>
</svg>
