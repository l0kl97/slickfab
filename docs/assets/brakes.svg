<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t d">
  <title id="t">slickfab and slickrails: where the brakes engage</title>
  <desc id="d">slickfab moves the work: implement in the agent session, commit and push, review on the pull request, you merge. slickrails brakes at each stage: Stop gate and Bash guard in the session, pre-commit and commit-msg hooks, pre-push checks with a local AI review, CI on the pull request, branch protection at the merge.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f2328; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lane { fill: #59636e; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.04em; }
    .note { fill: #59636e; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .step { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .steptext { fill: #1f2328; font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sub { fill: #59636e; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .gate { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.4; }
    .gatetext { fill: #3b2300; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .gatesub { fill: #4d2d00; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .brake { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .braketext { fill: #82071e; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .brakesub { fill: #5c0011; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .line { stroke: #6e7781; stroke-width: 1.5; fill: none; }
    .dash { stroke: #6e7781; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #3d444d; }
      .title { fill: #f0f6fc; }
      .lane, .note, .sub { fill: #9198a1; }
      .step { fill: #151b23; stroke: #656c76; }
      .steptext { fill: #f0f6fc; }
      .gate { fill: #2e2410; stroke: #d29922; }
      .gatetext { fill: #f2cc60; }
      .gatesub { fill: #e3c77a; }
      .brake { fill: #2d1316; stroke: #f85149; }
      .braketext { fill: #ff9492; }
      .brakesub { fill: #f0b4b1; }
      .line, .dash { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="879" height="439" rx="10"/>
  <text class="title" x="24" y="34">Where slickrails brakes</text>

  <!-- Stages -->
  <text class="lane" x="24" y="68">AGENT SESSION</text>
  <text class="lane" x="196" y="68">COMMIT</text>
  <text class="lane" x="368" y="68">PUSH</text>
  <text class="lane" x="540" y="68">PULL REQUEST</text>
  <text class="lane" x="712" y="68">MERGE</text>
  <path class="line" d="M24,80 H854" marker-end="url(#arrow)"/>

  <!-- slickfab -->
  <text class="lane" x="24" y="112">SLICKFAB · MOVES THE WORK</text>
  <rect class="step" x="24" y="122" width="494" height="54" rx="6"/>
  <text class="steptext" x="271" y="145" text-anchor="middle">implement</text>
  <text class="sub" x="271" y="164" text-anchor="middle">TDD per ticket, red then green, until the pull request</text>
  <rect class="step" x="540" y="122" width="150" height="54" rx="6"/>
  <text class="steptext" x="615" y="145" text-anchor="middle">review</text>
  <text class="sub" x="615" y="164" text-anchor="middle">fresh session</text>
  <rect class="gate" x="712" y="122" width="144" height="54" rx="6"/>
  <text class="gatetext" x="784" y="145" text-anchor="middle">You merge</text>
  <text class="gatesub" x="784" y="164" text-anchor="middle">human gate</text>
  <path class="line" d="M518,149 H538" marker-end="url(#arrow)"/>
  <path class="line" d="M690,149 H710" marker-end="url(#arrow)"/>

  <!-- slickrails -->
  <text class="lane" x="24" y="214">SLICKRAILS · STOPS WHAT IS NOT READY</text>
  <rect class="brake" x="24" y="224" width="150" height="116" rx="6"/>
  <text class="braketext" x="36" y="248">Stop gate</text>
  <text class="brakesub" x="36" y="268">no "done" while</text>
  <text class="brakesub" x="36" y="285">checks are red</text>
  <text class="braketext" x="36" y="312">Bash guard</text>
  <text class="brakesub" x="36" y="330">blocks --no-verify</text>
  <rect class="brake" x="196" y="224" width="150" height="116" rx="6"/>
  <text class="braketext" x="208" y="248">pre-commit</text>
  <text class="brakesub" x="208" y="268">secrets, .env files</text>
  <text class="braketext" x="208" y="294">commit-msg</text>
  <text class="brakesub" x="208" y="314">large commits need</text>
  <text class="brakesub" x="208" y="331">a why in the body</text>
  <rect class="brake" x="368" y="224" width="150" height="116" rx="6"/>
  <text class="braketext" x="380" y="248">pre-push</text>
  <text class="brakesub" x="380" y="268">typecheck and tests</text>
  <text class="braketext" x="380" y="294">AI review</text>
  <text class="brakesub" x="380" y="314">of the outgoing diff</text>
  <rect class="brake" x="540" y="224" width="150" height="116" rx="6"/>
  <text class="braketext" x="552" y="248">CI</text>
  <text class="brakesub" x="552" y="268">the same checks</text>
  <text class="brakesub" x="552" y="285">again, plus security</text>
  <text class="brakesub" x="552" y="302">and PR size</text>
  <rect class="brake" x="712" y="224" width="144" height="116" rx="6"/>
  <text class="braketext" x="724" y="248">Branch</text>
  <text class="braketext" x="724" y="266">protection</text>
  <text class="brakesub" x="724" y="288">red checks block</text>
  <text class="brakesub" x="724" y="305">the merge</text>

  <!-- Shared -->
  <text class="lane" x="24" y="378">WORKING TOGETHER</text>
  <text class="note" x="24" y="400">One set of check commands (.slickrails/config.sh) · review reads what slickrails already reported</text>
  <text class="note" x="24" y="420">retro turns repeated mistakes into proposals for new checks, applied only with your OK</text>
</svg>
